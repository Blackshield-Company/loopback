name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - run: mix deps.get
      - run: mix compile
      - run: mix format && git diff > /tmp/fmt.patch; git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: fmt
          path: /tmp/fmt.patch
      - run: mix format --check-formatted
      - run: mix test
